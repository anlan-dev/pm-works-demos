<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptBoard</title>
<style>
/* ========== 包豪斯风格基础样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #F5F5F5;
  --fg: #111111;
  --gray: #888888;
  --red: #E53935;
  --yellow: #FDD835;
  --blue: #1E88E5;
  --border: #111111;
  --card-bg: #FFFFFF;
  --input-bg: #FFFFFF;
  --hover-bg: #111111;
  --hover-fg: #F5F5F5;
}

/* 暗色模式 */
.dark {
  --bg: #111111;
  --fg: #F5F5F5;
  --gray: #888888;
  --red: #EF5350;
  --yellow: #FFEE58;
  --blue: #42A5F5;
  --border: #F5F5F5;
  --card-bg: #1a1a1a;
  --input-bg: #222222;
  --hover-bg: #F5F5F5;
  --hover-fg: #111111;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ========== 顶部标题区 ========== */
.header {
  border-bottom: 3px solid var(--border);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
}

.header .mode-label {
  font-size: 13px;
  color: var(--gray);
}

/* ========== 主体布局 ========== */
.main {
  display: flex;
  min-height: calc(100vh - 130px);
}

.left-panel {
  width: 50%;
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
}

.right-panel {
  width: 50%;
  display: flex;
  flex-direction: column;
}

/* ========== 输入区 ========== */
.input-area {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.input-area textarea {
  flex: 1;
  min-height: 200px;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 0;
  padding: 16px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  color: var(--fg);
  resize: none;
  outline: none;
  transition: background 0.3s, color 0.3s, border-color 0.3s;
}

.input-area textarea::placeholder {
  color: var(--gray);
}

.generate-btn {
  margin-top: 12px;
  padding: 10px 24px;
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 0;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  align-self: flex-end;
}

.generate-btn:hover {
  background: var(--hover-bg);
  color: var(--hover-fg);
}

/* ========== 模板区 ========== */
.templates-bar {
  border-top: 2px solid var(--border);
  padding: 12px 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.template-btn {
  padding: 8px 16px;
  background: var(--card-bg);
  border: 1px solid var(--gray);
  border-radius: 0;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
}

.template-btn:hover {
  border-color: var(--border);
}

.template-btn.active {
  background: var(--hover-bg);
  color: var(--hover-fg);
  border-color: var(--border);
}

/* ========== 输出区 ========== */
.output-area {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.output-area pre {
  flex: 1;
  min-height: 200px;
  background: var(--input-bg);
  border: 2px solid var(--border);
  border-radius: 0;
  padding: 16px;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  color: var(--fg);
  overflow: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
  transition: background 0.3s, color 0.3s;
}

.copy-btn {
  margin-top: 12px;
  padding: 10px 24px;
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 0;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
  align-self: flex-end;
  position: relative;
}

.copy-btn:hover {
  background: var(--hover-bg);
  color: var(--hover-fg);
}

.copy-toast {
  position: absolute;
  top: -32px;
  right: 0;
  background: var(--fg);
  color: var(--bg);
  padding: 4px 12px;
  font-size: 12px;
  display: none;
}

.copy-toast.show {
  display: block;
}

/* ========== 底部栏 ========== */
.bottom-bar {
  border-top: 3px solid var(--border);
  display: flex;
  min-height: 50px;
}

/* 模型配置区 */
.model-section {
  flex: 1;
  border-right: 2px solid var(--border);
  padding: 12px 20px;
}

.model-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.model-list {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}

.model-item {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  padding: 4px 8px;
  transition: background 0.2s;
}

.model-item:hover {
  background: var(--card-bg);
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.status-dot.red { background: var(--red); }
.status-dot.yellow { background: var(--yellow); }
.status-dot.blue { background: var(--blue); }

.model-name {
  font-size: 13px;
  font-weight: 600;
}

/* 模型配置面板 */
.model-config-panel {
  display: none;
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  background: var(--card-bg);
  transition: background 0.3s;
}

.model-config-panel.open {
  display: block;
}

.config-row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.config-row label {
  font-size: 12px;
  font-weight: 600;
  min-width: 70px;
  color: var(--fg);
}

.config-row input {
  flex: 1;
  min-width: 150px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 0;
  background: var(--input-bg);
  color: var(--fg);
  font-family: 'Courier New', monospace;
  font-size: 13px;
  outline: none;
  transition: background 0.3s, color 0.3s;
}

.config-row input::placeholder {
  color: var(--gray);
}

.save-config-btn {
  padding: 6px 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 0;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}

.save-config-btn:hover {
  background: var(--hover-bg);
  color: var(--hover-fg);
}

/* 模式切换区 */
.mode-section {
  padding: 12px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  min-width: 180px;
}

.mode-btns {
  display: flex;
  gap: 8px;
}

.mode-btn {
  padding: 8px 14px;
  background: var(--card-bg);
  border: 1px solid var(--gray);
  border-radius: 0;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  cursor: pointer;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  white-space: nowrap;
}

.mode-btn:hover {
  border-color: var(--border);
}

.mode-btn.active {
  background: var(--hover-bg);
  color: var(--hover-fg);
  border-color: var(--border);
}

/* 暗色模式切换 */
.dark-toggle {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--gray);
  border-radius: 0;
  font-size: 12px;
  cursor: pointer;
  color: var(--fg);
  transition: background 0.2s, color 0.2s;
}

.dark-toggle:hover {
  background: var(--hover-bg);
  color: var(--hover-fg);
}

/* ========== 历史记录 ========== */
.history-section {
  border-top: 2px solid var(--border);
  padding: 12px 20px;
}

.history-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.history-item {
  padding: 6px 12px;
  background: var(--card-bg);
  border: 1px solid var(--gray);
  font-size: 12px;
  cursor: pointer;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}

.history-item:hover {
  background: var(--hover-bg);
  color: var(--hover-fg);
}

/* ========== 加载状态 ========== */
.loading {
  color: var(--gray);
  font-style: italic;
}

/* ========== 响应式 ========== */
@media (max-width: 800px) {
  .main {
    flex-direction: column;
  }
  .left-panel, .right-panel {
    width: 100%;
    border-right: none;
  }
  .left-panel {
    border-bottom: 2px solid var(--border);
  }
  .bottom-bar {
    flex-direction: column;
  }
  .model-section {
    border-right: none;
    border-bottom: 2px solid var(--border);
  }
  .mode-section {
    min-width: unset;
  }
}
</style>
</head>
<body>

<!-- 顶部标题区 -->
<header class="header">
  <h1>PromptBoard</h1>
  <span class="mode-label" id="modeLabel">规则模式</span>
</header>

<!-- 主体 -->
<div class="main">
  <!-- 左侧：输入区 -->
  <div class="left-panel">
    <div class="input-area">
      <textarea id="inputArea" placeholder="用自然语言描述你想要的 AI 助手...（Ctrl+Enter 生成）"></textarea>
      <button class="generate-btn" id="generateBtn">生成</button>
    </div>
    <div class="history-section" id="historySection" style="display:none;">
      <div class="history-title">最近记录</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <div class="templates-bar">
      <button class="template-btn active" data-template="general">General</button>
      <button class="template-btn" data-template="role">Role</button>
      <button class="template-btn" data-template="cot">COT</button>
      <button class="template-btn" data-template="writing">Writing</button>
      <button class="template-btn" data-template="code">Code</button>
    </div>
  </div>

  <!-- 右侧：输出区 -->
  <div class="right-panel">
    <div class="output-area">
      <pre id="outputArea">生成的 Prompt 将显示在这里...</pre>
      <button class="copy-btn" id="copyBtn">
        复制到剪贴板
        <span class="copy-toast" id="copyToast">已复制</span>
      </button>
    </div>
  </div>
</div>

<!-- 底部栏 -->
<div class="bottom-bar">
  <!-- 模型配置区 -->
  <div class="model-section">
    <div class="model-section-title">模型配置</div>
    <div class="model-list" id="modelList"></div>
  </div>

  <!-- 模式切换区 -->
  <div class="mode-section">
    <div class="mode-btns">
      <button class="mode-btn active" data-mode="rule" id="ruleModeBtn">规则模式</button>
      <button class="mode-btn" data-mode="ai" id="aiModeBtn">AI增强模式</button>
    </div>
    <button class="dark-toggle" id="darkToggle">暗色模式</button>
  </div>
</div>

<!-- 模型配置面板（动态插入） -->
<div id="configPanels"></div>

<script>
// ========== 数据模型 ==========
const MODELS = [
  { id: 'mimo', name: 'Mimo', defaultBaseUrl: '', defaultModelName: '' },
  { id: 'deepseek', name: 'DeepSeek', defaultBaseUrl: 'https://api.deepseek.com', defaultModelName: 'deepseek-chat' },
  { id: 'openai', name: 'OpenAI', defaultBaseUrl: 'https://api.openai.com/v1', defaultModelName: 'gpt-4o-mini' },
  { id: 'custom', name: '自定义', defaultBaseUrl: '', defaultModelName: '' }
];

// Prompt 骨架模板
const TEMPLATES = {
  general: {
    name: 'General',
    keywords: [],
    fields: ['任务目标', '输入内容', '输出要求', '约束条件'],
    skeleton: `# 通用 Prompt

## 任务目标
{task}

## 输入
{input}

## 输出要求
{output}

## 约束条件
{constraints}`
  },
  role: {
    name: 'Role',
    keywords: ['角色', '故事', '恐怖', '扮演', '人物', '对话', '小说', '想象'],
    fields: ['角色设定', '背景信息', '行为规则', '输出格式'],
    skeleton: `# 角色扮演 Prompt

## 角色设定
{role}

## 背景信息
{background}

## 行为规则
{rules}

## 输出格式
{format}`
  },
  cot: {
    name: 'COT',
    keywords: ['步骤', '分步', '推理', '分析', '逻辑', '过程', '思考'],
    fields: ['问题描述', '推理步骤', '期望输出', '注意事项'],
    skeleton: `# 思维链（Chain-of-Thought）Prompt

## 问题描述
{problem}

## 推理步骤
请按以下步骤逐步推理：
{steps}

## 期望输出
{output}

## 注意事项
{notes}`
  },
  writing: {
    name: 'Writing',
    keywords: ['写作', '文章', '文案', '邮件', '报告', '摘要', '翻译', '改写'],
    fields: ['文体类型', '主题内容', '风格要求', '字数限制'],
    skeleton: `# 写作 Prompt

## 文体类型
{type}

## 主题内容
{topic}

## 风格要求
{style}

## 字数限制
{length}`
  },
  code: {
    name: 'Code',
    keywords: ['代码', '编程', '函数', 'bug', '调试', 'API', '开发', '程序', '脚本', '算法'],
    fields: ['编程语言', '功能描述', '输入输出', '技术约束'],
    skeleton: `# 代码 Prompt

## 编程语言
{language}

## 功能描述
{description}

## 输入输出
{io}

## 技术约束
{constraints}`
  }
};

// ========== 状态管理 ==========
let state = {
  mode: 'rule', // 'rule' | 'ai'
  activeModel: null,
  selectedTemplate: 'general',
  modelConfigs: {},
  history: [],
  darkMode: false
};

// ========== localStorage ==========
function loadState() {
  try {
    const saved = localStorage.getItem('promptboard_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  try {
    localStorage.setItem('promptboard_state', JSON.stringify({
      mode: state.mode,
      activeModel: state.activeModel,
      selectedTemplate: state.selectedTemplate,
      modelConfigs: state.modelConfigs,
      history: state.history.slice(0, 10),
      darkMode: state.darkMode
    }));
  } catch (e) { /* ignore */ }
}

// ========== UI 渲染 ==========
function renderModelList() {
  const list = document.getElementById('modelList');
  list.innerHTML = '';
  MODELS.forEach(m => {
    const cfg = state.modelConfigs[m.id] || {};
    let dotClass = 'red';
    if (cfg.apiKey && state.activeModel === m.id) dotClass = 'blue';
    else if (cfg.apiKey) dotClass = 'yellow';

    const item = document.createElement('div');
    item.className = 'model-item';
    item.innerHTML = `<span class="status-dot ${dotClass}"></span><span class="model-name">${m.name}</span>`;
    item.addEventListener('click', () => toggleConfigPanel(m.id));
    list.appendChild(item);
  });
}

function renderConfigPanels() {
  const container = document.getElementById('configPanels');
  container.innerHTML = '';
  MODELS.forEach(m => {
    const cfg = state.modelConfigs[m.id] || {};
    const panel = document.createElement('div');
    panel.className = 'model-config-panel';
    panel.id = `panel-${m.id}`;
    panel.innerHTML = `
      <div class="config-row">
        <label>API Key</label>
        <input type="password" id="key-${m.id}" placeholder="sk-..." value="${cfg.apiKey || ''}">
      </div>
      <div class="config-row">
        <label>Base URL</label>
        <input type="text" id="url-${m.id}" placeholder="${m.defaultBaseUrl || 'https://...'}" value="${cfg.baseUrl || m.defaultBaseUrl}">
      </div>
      <div class="config-row">
        <label>模型名称</label>
        <input type="text" id="model-${m.id}" placeholder="${m.defaultModelName || 'model-name'}" value="${cfg.modelName || m.defaultModelName}">
      </div>
      <div class="config-row">
        <label></label>
        <button class="save-config-btn" data-model="${m.id}">保存</button>
      </div>
    `;
    container.appendChild(panel);
  });

  // 保存按钮事件
  container.querySelectorAll('.save-config-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.model;
      const apiKey = document.getElementById(`key-${id}`).value.trim();
      const baseUrl = document.getElementById(`url-${id}`).value.trim();
      const modelName = document.getElementById(`model-${id}`).value.trim();
      state.modelConfigs[id] = { apiKey, baseUrl, modelName };
      state.activeModel = id;
      saveState();
      renderModelList();
      closeAllPanels();
    });
  });
}

function toggleConfigPanel(modelId) {
  const panel = document.getElementById(`panel-${modelId}`);
  const isOpen = panel.classList.contains('open');
  closeAllPanels();
  if (!isOpen) {
    panel.classList.add('open');
  }
}

function closeAllPanels() {
  document.querySelectorAll('.model-config-panel').forEach(p => p.classList.remove('open'));
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (state.history.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  list.innerHTML = '';
  state.history.forEach((h, i) => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.textContent = h.input.slice(0, 40) + (h.input.length > 40 ? '...' : '');
    item.title = `${h.template} | ${h.model || '规则'} | ${new Date(h.timestamp).toLocaleString()}`;
    item.addEventListener('click', () => {
      document.getElementById('inputArea').value = h.input;
      document.getElementById('outputArea').textContent = h.output;
      // 选中对应模板
      document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
      const targetBtn = document.querySelector(`[data-template="${h.template}"]`);
      if (targetBtn) {
        targetBtn.classList.add('active');
        state.selectedTemplate = h.template;
      }
    });
    list.appendChild(item);
  });
}

function updateModeUI() {
  const isRule = state.mode === 'rule';
  document.getElementById('modeLabel').textContent = isRule ? '规则模式' : 'AI增强模式';
  document.getElementById('ruleModeBtn').classList.toggle('active', isRule);
  document.getElementById('aiModeBtn').classList.toggle('active', !isRule);
}

function updateDarkMode() {
  document.body.classList.toggle('dark', state.darkMode);
  document.getElementById('darkToggle').textContent = state.darkMode ? '亮色模式' : '暗色模式';
}

// ========== 关键词匹配（规则模式）==========
function matchTemplate(text) {
  const lower = text.toLowerCase();
  let bestMatch = 'general';
  let bestScore = 0;

  for (const [key, tpl] of Object.entries(TEMPLATES)) {
    if (key === 'general') continue;
    let score = 0;
    for (const kw of tpl.keywords) {
      if (lower.includes(kw)) score++;
    }
    if (score > bestScore) {
      bestScore = score;
      bestMatch = key;
    }
  }
  return bestMatch;
}

// ========== 规则模式生成 ==========
function generateByRule(input) {
  const templateKey = state.selectedTemplate;
  // 如果用户手动选了 general，但输入里有关键词，尝试自动匹配
  let tpl;
  if (templateKey === 'general') {
    const autoKey = matchTemplate(input);
    tpl = TEMPLATES[autoKey];
  } else {
    tpl = TEMPLATES[templateKey];
  }

  // 根据模板骨架填充用户输入
  let result = tpl.skeleton;
  const placeholders = result.match(/\{(\w+)\}/g) || [];
  placeholders.forEach(ph => {
    result = result.replace(ph, input);
  });
  return result;
}

// ========== AI 增强模式生成 ==========
async function generateByAI(input) {
  const modelId = state.activeModel;
  const cfg = state.modelConfigs[modelId];
  if (!cfg || !cfg.apiKey) {
    throw new Error('请先配置当前模型的 API Key');
  }

  const tpl = TEMPLATES[state.selectedTemplate];
  const metaPrompt = `你是一个 Prompt 工程师。用户以自然语言描述了他想要的 AI 角色，请将其重写为结构化的、可直接使用的 Prompt。
用户选择的模板类型：${tpl.name}
骨架结构要求：${tpl.fields.join('、')}
用户原始描述：${input}

请输出结构化的 Prompt，不要输出多余的解释。`;

  const baseUrl = cfg.baseUrl.replace(/\/+$/, '');
  const response = await fetch(`${baseUrl}/v1/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${cfg.apiKey}`
    },
    body: JSON.stringify({
      model: cfg.modelName,
      messages: [
        { role: 'system', content: metaPrompt },
        { role: 'user', content: input }
      ],
      temperature: 0.7
    })
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throw new Error(`API 请求失败 (${response.status}): ${errText.slice(0, 200)}`);
  }

  const data = await response.json();
  return data.choices?.[0]?.message?.content || '（模型未返回内容）';
}

// ========== 生成入口 ==========
async function handleGenerate() {
  const input = document.getElementById('inputArea').value.trim();
  if (!input) return;

  const outputEl = document.getElementById('outputArea');
  const generateBtn = document.getElementById('generateBtn');

  generateBtn.disabled = true;
  generateBtn.textContent = '生成中...';

  try {
    let result;
    if (state.mode === 'ai') {
      outputEl.textContent = '正在生成...';
      result = await generateByAI(input);
    } else {
      result = generateByRule(input);
    }

    outputEl.textContent = result;

    // 保存历史
    const entry = {
      input,
      output: result,
      template: state.selectedTemplate,
      model: state.mode === 'ai' ? state.activeModel : null,
      timestamp: Date.now()
    };
    state.history.unshift(entry);
    if (state.history.length > 10) state.history = state.history.slice(0, 10);
    saveState();
    renderHistory();

  } catch (err) {
    outputEl.textContent = `错误：${err.message}`;
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = '生成';
  }
}

// ========== 事件绑定 ==========
function init() {
  loadState();
  renderModelList();
  renderConfigPanels();
  renderHistory();
  updateModeUI();
  updateDarkMode();

  // 模板选择
  document.querySelectorAll('.template-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.selectedTemplate = btn.dataset.template;
      saveState();
    });
  });

  // 恢复选中模板
  const savedTpl = document.querySelector(`[data-template="${state.selectedTemplate}"]`);
  if (savedTpl) {
    document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
    savedTpl.classList.add('active');
  }

  // 生成按钮
  document.getElementById('generateBtn').addEventListener('click', handleGenerate);

  // Ctrl+Enter 生成
  document.getElementById('inputArea').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') {
      e.preventDefault();
      handleGenerate();
    }
  });

  // 复制按钮
  document.getElementById('copyBtn').addEventListener('click', () => {
    const text = document.getElementById('outputArea').textContent;
    if (!text || text.startsWith('生成的') || text.startsWith('错误')) return;
    navigator.clipboard.writeText(text).then(() => {
      const toast = document.getElementById('copyToast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    });
  });

  // 模式切换
  document.getElementById('ruleModeBtn').addEventListener('click', () => {
    state.mode = 'rule';
    saveState();
    updateModeUI();
  });
  document.getElementById('aiModeBtn').addEventListener('click', () => {
    state.mode = 'ai';
    saveState();
    updateModeUI();
  });

  // 暗色模式
  document.getElementById('darkToggle').addEventListener('click', () => {
    state.darkMode = !state.darkMode;
    saveState();
    updateDarkMode();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
