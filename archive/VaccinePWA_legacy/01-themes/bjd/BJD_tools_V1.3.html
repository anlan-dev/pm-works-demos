            --tab-active-bg: #d4e8f8;
            --tab-active-color: #2c6b9e;
            --tab-inactive-color: #6f95b5;
            --doll-card-bg: #eef4fc;
            --doll-card-border: #cfe2f2;

            --tab-active-color: #7b4bbd;
            --tab-inactive-color: #9b7bc2;

            --bg-body: #f2faf5;
            --header-bg: #e0f5e9;
            --border-color: #bdd9cc;

        .page { display: none; }
        .page.active { display: block; }
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

        .doll-grid {

        .doll-meta { font-size: 0.7rem; color: var(--meta-text); }
        .delete-btn { margin-top: 6px; color: var(--meta-text); font-size: 0.7rem; cursor: pointer; }
        .inspo-item {

        }

        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;

            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 24px 20px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .image-preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--input-border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            overflow: hidden;
        }
        .avatar-select-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
        .photo-item { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; margin: 4px; cursor: pointer; border: 2px solid transparent; }
        .small-note { font-size: 0.7rem; color: var(--meta-text); margin-top: 6px; }
        .backup-options { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

        }

    </style>
</head>

<script>
    (function(){
        // ---------- IndexedDB 核心 ----------
        const DB_NAME = 'BJD_Vault_Complete', DB_VERSION = 4;
        let db = null;
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if(!db.objectStoreNames.contains('dolls')) db.createObjectStore('dolls', { keyPath: 'id' });
                    if(!db.objectStoreNames.contains('inspirations')) db.createObjectStore('inspirations', { keyPath: 'id' });
                    if(!db.objectStoreNames.contains('wardrobe')) db.createObjectStore('wardrobe', { keyPath: 'id' });
                    if(!db.objectStoreNames.contains('makeupHistory')) db.createObjectStore('makeupHistory', { keyPath: 'id' });
                    if(!db.objectStoreNames.contains('reminders')) db.createObjectStore('reminders', { keyPath: 'id' });
                };
                req.onsuccess = (e) => { db = e.target.result; resolve(db); };
                req.onerror = reject;
            });
        }
        async function getStore(storeName, mode='readonly') { if(!db) await openDB(); return db.transaction(storeName, mode).objectStore(storeName); }
        async function getAll(storeName) { const store = await getStore(storeName); return new Promise((res,rej)=>{ const req=store.getAll(); req.onsuccess=()=>res(req.result); req.onerror=rej; }); }
        async function putItem(storeName, item) { const store = await getStore(storeName, 'readwrite'); return new Promise((res,rej)=>{ const req=store.put(item); req.onsuccess=res; req.onerror=rej; }); }
        async function deleteItem(storeName, id) { const store = await getStore(storeName, 'readwrite'); return new Promise((res,rej)=>{ const req=store.delete(id); req.onsuccess=res; req.onerror=rej; }); }
        async function clearStore(storeName) { const store = await getStore(storeName, 'readwrite'); return store.clear(); }

        let dolls = [], inspirations = [], wardrobes = [], makeups = [], reminders = [];
        let sizeFilter='', artistFilter='', tagFilter='', searchKeyword='';
        
        async function loadAll() {
            dolls = await getAll('dolls') || [];
            inspirations = await getAll('inspirations') || [];
            wardrobes = await getAll('wardrobe') || [];
            makeups = await getAll('makeupHistory') || [];
            reminders = await getAll('reminders') || [];
            if(dolls.length===0) {
                const demo = { id: 'd1', name: '小荔枝', sculpt: 'MYou-眠娜', brand: 'napi', size: '4分', artist: '荔枝壮士', arrival: '2025-03-12', avatarImage: '', avatarEmoji: '🍓', tags: '有妆', photos: [] };
                await putItem('dolls', demo);
                dolls.push(demo);
            }
            renderAll();
        }
        async function saveAllAndRender() {
            for(let d of dolls) await putItem('dolls', d);
            for(let i of inspirations) await putItem('inspirations', i);
            for(let w of wardrobes) await putItem('wardrobe', w);
            for(let m of makeups) await putItem('makeupHistory', m);
            for(let r of reminders) await putItem('reminders', r);
            renderAll();
        }
        function showToast(msg) { let t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
        
        // 压缩图片 (复用原版高质量)
        function compressImage(file, maxSize=400, quality=0.7) {
            return new Promise((res,rej)=>{
                const reader=new FileReader();
                reader.onload=e=>{ const img=new Image(); img.onload=()=>{ let w=img.width, h=img.height; if(w>maxSize){ h*=maxSize/w; w=maxSize; } const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',quality)); }; img.onerror=rej; img.src=e.target.result; };
                reader.onerror=rej; reader.readAsDataURL(file);
            });
        }
        
        // 渲染娃娃列表
        function getFilteredDolls() {
            return dolls.filter(d => {
                if(sizeFilter && d.size!==sizeFilter) return false;
                if(artistFilter && d.artist!==artistFilter) return false;
                if(tagFilter && !(d.tags||'').includes(tagFilter)) return false;
                if(searchKeyword && !`${d.name} ${d.sculpt||''} ${d.brand||''}`.toLowerCase().includes(searchKeyword.toLowerCase())) return false;
                return true;
            });
        }
        function renderInventory() {
            const filtered = getFilteredDolls();
            const container = document.getElementById('dollListContainer');
            container.innerHTML = filtered.map(d => `<div class="doll-card" data-doll-id="${d.id}"><div class="doll-avatar">${d.avatarImage?`<img src="${d.avatarImage}">`:(d.avatarEmoji||'🧸')}</div><div class="doll-name">${escapeHtml(d.name)}</div><div class="doll-meta">${d.sculpt||''} · ${d.size}</div><div class="doll-meta">🎨 ${d.artist||'?'}</div><div class="delete-btn" data-delete="${d.id}">🗑️ 删除</div></div>`).join('');
            document.getElementById('dollStats').innerHTML = `共 ${dolls.length} 只 · 总花费估算: ¥${dolls.reduce((s,d)=>s+(Number(d.totalCost)||0),0)}`;
            updateFilterOptions();
        }
        function updateFilterOptions() {
            const sizeSel = document.getElementById('filterSize'); sizeSel.innerHTML='<option value="">全部尺寸</option>'+[...new Set(dolls.map(d=>d.size))].map(s=>`<option>${s}</option>`).join('');
            const artistSel = document.getElementById('filterArtist'); artistSel.innerHTML='<option value="">全部壮士</option>'+[...new Set(dolls.map(d=>d.artist).filter(a=>a))].map(a=>`<option>${escapeHtml(a)}</option>`).join('');
            const tagSel = document.getElementById('filterTag'); tagSel.innerHTML='<option value="">全部标签</option>'+[...new Set(dolls.flatMap(d=>(d.tags||'').split(',').filter(t=>t)))].map(t=>`<option>${t}</option>`).join('');
        }
        function renderGallery() { 
            const selDiv = document.getElementById('galleryDollSelect'); 
            selDiv.innerHTML = `<select id="galleryDollSelectInner">${dolls.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}</select>`;
            const inner = document.getElementById('galleryDollSelectInner');
            if(inner) inner.onchange = (e) => { currentGalleryDoll = dolls.find(d=>d.id===e.target.value); showGalleryPhotos(); };
            if(dolls[0]) { currentGalleryDoll = dolls[0]; showGalleryPhotos(); }
        }
        let currentGalleryDoll = null;
        function showGalleryPhotos() {
            const container = document.getElementById('galleryPhotos');
            if(!currentGalleryDoll) return;
            const photos = currentGalleryDoll.photos || [];
            container.innerHTML = photos.map((p,idx)=>`<img src="${p}" class="photo-item" data-idx="${idx}">`).join('');
            document.getElementById('addPhotoBtn').onclick = () => document.getElementById('photoUploadInput').click();
            document.getElementById('photoUploadInput').onchange = async (e) => {
                for(let file of e.target.files) {
                    const base64 = await compressImage(file, 800, 0.7);
                    if(!currentGalleryDoll.photos) currentGalleryDoll.photos=[];
                    currentGalleryDoll.photos.push(base64);
                    await putItem('dolls', currentGalleryDoll);
                }
                showGalleryPhotos(); saveAllAndRender();
            };
        }
        function renderInspo() {
            const container = document.getElementById('inspoListContainer');
            container.innerHTML = inspirations.map(i => `<div class="inspo-item"><div><b>${escapeHtml(i.title)}</b> ${i.dollId?`[关联: ${dolls.find(d=>d.id===i.dollId)?.name||''}]`:''}</div><div>${i.description||''}</div>${i.imageBase64?`<img src="${i.imageBase64}" class="inspo-img">`:''}<div class="small-note">${i.source||''} ${new Date(i.createdAt).toLocaleDateString()}</div><button data-del-inspo="${i.id}" class="btn btn-sm">删除</button></div>`).join('');
            const dollSelect = document.getElementById('inspoDollId');
            dollSelect.innerHTML = '<option value="">无关联</option>'+dolls.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('');
        }
        function renderWardrobe() { document.getElementById('wardrobeList').innerHTML = wardrobes.map(w => `<div class="doll-card"><div>${escapeHtml(w.name)} (${w.type})</div><div>¥${w.price||0}</div><button data-del-ward="${w.id}" class="btn btn-sm">删除</button></div>`).join(''); }
        function renderMakeup() { document.getElementById('makeupList').innerHTML = makeups.map(m => `<div class="card"><b>${escapeHtml(m.name)}</b> 妆师:${m.artist} 娃娃:${dolls.find(d=>d.id===m.dollId)?.name||''}</div>`).join(''); const sel=document.getElementById('makeupDollId'); if(sel) sel.innerHTML=dolls.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join(''); }
        function renderReminders() { document.getElementById('reminderList').innerHTML = reminders.map(r => `<div class="card"><b>${escapeHtml(r.title)}</b> ${r.type} ${r.date}<button data-del-rem="${r.id}" class="btn btn-sm">删除</button></div>`).join(''); const sel=document.getElementById('reminderDollId'); if(sel) sel.innerHTML='<option value="">无</option>'+dolls.map(d=>`<option value="${d.id}">${escapeHtml(d.name)}</option>`).join(''); }
        
        // 备份导出导入 (支持所有表，合并/覆盖模式)
        async function exportFullBackup() {
            const data = { dolls, inspirations, wardrobes, makeups, reminders };
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)]));
            a.download = `bjd_full_backup_${Date.now()}.json`;
            a.click();
        }
        async function importBackup(file, mode) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if(mode === 'overwrite') {
                        await clearStore('dolls'); await clearStore('inspirations'); await clearStore('wardrobe'); await clearStore('makeupHistory'); await clearStore('reminders');
                        if(data.dolls) for(let d of data.dolls) await putItem('dolls', d);
                        if(data.inspirations) for(let i of data.inspirations) await putItem('inspirations', i);
                        if(data.wardrobes) for(let w of data.wardrobes) await putItem('wardrobe', w);
                        if(data.makeups) for(let m of data.makeups) await putItem('makeupHistory', m);
                        if(data.reminders) for(let r of data.reminders) await putItem('reminders', r);
                    } else {
                        // 合并模式 id去重
                        for(let newD of (data.dolls||[])) { const idx = dolls.findIndex(d=>d.id===newD.id); if(idx!==-1) dolls[idx]=newD; else dolls.push(newD); }
                        for(let newI of (data.inspirations||[])) { const idx = inspirations.findIndex(i=>i.id===newI.id); if(idx!==-1) inspirations[idx]=newI; else inspirations.push(newI); }
                        for(let newW of (data.wardrobes||[])) { const idx = wardrobes.findIndex(w=>w.id===newW.id); if(idx!==-1) wardrobes[idx]=newW; else wardrobes.push(newW); }
                        for(let newM of (data.makeups||[])) { const idx = makeups.findIndex(m=>m.id===newM.id); if(idx!==-1) makeups[idx]=newM; else makeups.push(newM); }
                        for(let newR of (data.reminders||[])) { const idx = reminders.findIndex(r=>r.id===newR.id); if(idx!==-1) reminders[idx]=newR; else reminders.push(newR); }
                        await saveAllAndRender();
                    }
                    await loadAll();
                    showToast('导入成功');
                    document.getElementById('backupModal').style.display='none';
                } catch(err) { alert("导入失败："+err.message); }
            };
            reader.readAsText(file);
        }

        // 主题切换
        function setTheme(theme) {
            document.body.classList.remove('theme-pink', 'theme-blue', 'theme-purple', 'theme-green', 'theme-cream');
            if (theme === 'pink') document.body.classList.add('theme-pink');
            else if (theme === 'blue') document.body.classList.add('theme-blue');
            else if (theme === 'purple') document.body.classList.add('theme-purple');
            else if (theme === 'green') document.body.classList.add('theme-green');
            else if (theme === 'cream') document.body.classList.add('theme-cream');
            localStorage.setItem('bjd_theme', theme);
        }
        const savedTheme = localStorage.getItem('bjd_theme') || 'pink';
        setTheme(savedTheme);
        document.querySelectorAll('.theme-dot').forEach(dot => dot.addEventListener('click', (e) => { setTheme(dot.dataset.theme); }));

        // 事件绑定
        function bindEvents() {
            document.querySelectorAll('.tab-item').forEach(tab=>{ tab.onclick=()=>{ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(`page-${tab.dataset.page}`).classList.add('active'); document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); renderAll(); }; });
            document.getElementById('filterSize').onchange=e=>{sizeFilter=e.target.value; renderInventory();};
            document.getElementById('filterArtist').onchange=e=>{artistFilter=e.target.value; renderInventory();};
            document.getElementById('filterTag').onchange=e=>{tagFilter=e.target.value; renderInventory();};
            document.getElementById('searchInput').oninput=e=>{searchKeyword=e.target.value; renderInventory();};
            document.getElementById('resetFilter').onclick=()=>{sizeFilter='';artistFilter='';tagFilter='';searchKeyword=''; document.getElementById('filterSize').value='';document.getElementById('filterArtist').value='';document.getElementById('filterTag').value='';document.getElementById('searchInput').value=''; renderInventory();};
            document.getElementById('showAddDollForm').onclick=()=>document.getElementById('addDollForm').style.display='block';
            document.getElementById('cancelAddDoll').onclick=()=>document.getElementById('addDollForm').style.display='none';
            let pendingAvatar=null;
            document.getElementById('addSelectAvatarBtn').onclick=()=>document.getElementById('addAvatarInput').click();
            document.getElementById('addAvatarInput').onchange=async(e)=>{ const f=e.target.files[0]; if(f) pendingAvatar=await compressImage(f,200); document.getElementById('addAvatarPreview').innerHTML=`<img src="${pendingAvatar}">`; };
            document.getElementById('saveDollBtn').onclick=async()=>{ const name=document.getElementById('dollName').value; if(!name) return; const newDoll={ id:Date.now()+''+Math.random(), name, sculpt:document.getElementById('dollSculpt').value, brand:document.getElementById('dollBrand').value, size:document.getElementById('dollSize').value, artist:document.getElementById('dollArtist').value, arrival:document.getElementById('dollArrival').value, avatarImage:pendingAvatar||'', tags:'', photos:[] }; dolls.push(newDoll); await saveAllAndRender(); document.getElementById('addDollForm').style.display='none'; pendingAvatar=null; };
            
            // 编辑娃娃
            document.getElementById('dollListContainer').addEventListener('click', async(e)=>{
                if(e.target.dataset.delete){ if(confirm('删除？')){ dolls=dolls.filter(d=>d.id!==e.target.dataset.delete); await saveAllAndRender(); } return; }
                const card=e.target.closest('[data-doll-id]'); if(card){ const doll=dolls.find(d=>d.id===card.dataset.dollId); if(doll) openEditModal(doll); }
            });
            window.openEditModal = function(doll) {
                document.getElementById('editDollId').value=doll.id; document.getElementById('editName').value=doll.name; document.getElementById('editSculpt').value=doll.sculpt||''; document.getElementById('editBrand').value=doll.brand||''; document.getElementById('editSize').value=doll.size; document.getElementById('editArtist').value=doll.artist||''; document.getElementById('editArrival').value=doll.arrival||''; document.getElementById('editTags').value=doll.tags||''; const previewDiv=document.getElementById('editAvatarPreview'); previewDiv.innerHTML=doll.avatarImage?`<img src="${doll.avatarImage}">`:(doll.avatarEmoji||'🧸'); window.editPendingAvatar=null; document.getElementById('editDollModal').style.display='flex';
            };
            document.getElementById('editAvatarBtn').onclick=()=>document.getElementById('editAvatarInput').click();
            document.getElementById('editAvatarInput').onchange=async(e)=>{ const f=e.target.files[0]; if(f) window.editPendingAvatar=await compressImage(f,200); document.getElementById('editAvatarPreview').innerHTML=`<img src="${window.editPendingAvatar}">`; };
            document.getElementById('saveEditDollBtn').onclick=async()=>{ const id=document.getElementById('editDollId').value; const doll=dolls.find(d=>d.id===id); if(doll){ doll.name=document.getElementById('editName').value; doll.sculpt=document.getElementById('editSculpt').value; doll.brand=document.getElementById('editBrand').value; doll.size=document.getElementById('editSize').value; doll.artist=document.getElementById('editArtist').value; doll.arrival=document.getElementById('editArrival').value; doll.tags=document.getElementById('editTags').value; if(window.editPendingAvatar) { doll.avatarImage=window.editPendingAvatar; doll.avatarEmoji=''; } await saveAllAndRender(); } document.getElementById('editDollModal').style.display='none'; };
            document.getElementById('cancelEditBtn').onclick=()=>document.getElementById('editDollModal').style.display='none';

            // 批量备份等
            document.getElementById('batchOperateBtn').onclick=()=>{ const listDiv=document.getElementById('batchSelectList'); listDiv.innerHTML=dolls.map(d=>`<label><input type="checkbox" value="${d.id}"> ${escapeHtml(d.name)}</label><br>`).join(''); document.getElementById('batchModal').style.display='flex'; };
            document.getElementById('closeBatchBtn').onclick=()=>document.getElementById('batchModal').style.display='none';
            document.getElementById('batchDeleteBtn').onclick=async()=>{ const checks=document.querySelectorAll('#batchSelectList input:checked'); for(let c of checks){ dolls=dolls.filter(d=>d.id!==c.value); await deleteItem('dolls',c.value); } await saveAllAndRender(); document.getElementById('batchModal').style.display='none'; };
            
            // 备份模态框
            const backupModal=document.getElementById('backupModal'); document.getElementById('showBackupModalBtn').onclick=()=>backupModal.style.display='flex'; document.getElementById('closeBackupModal').onclick=()=>backupModal.style.display='none'; document.getElementById('exportBackupBtn').onclick=()=>{ exportFullBackup(); backupModal.style.display='none'; }; document.getElementById('importBackupTrigger').onclick=()=>document.getElementById('importArea').style.display='block'; document.getElementById('cancelImportBtn').onclick=()=>document.getElementById('importArea').style.display='none'; document.getElementById('confirmImportBtn').onclick=()=>{ const mode=document.querySelector('input[name="importMode"]:checked').value; const fileInput=document.getElementById('importFileInput'); fileInput.click(); fileInput.onchange=(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0], mode); fileInput.value=''; }; };
            
            // 衣橱、妆面、提醒简易保存
            document.getElementById('addWardrobeBtn').onclick=()=>document.getElementById('wardrobeModal').style.display='flex'; document.getElementById('closeWardrobeBtn').onclick=()=>document.getElementById('wardrobeModal').style.display='none'; document.getElementById('saveWardrobeBtn').onclick=async()=>{ wardrobes.push({ id:Date.now()+''+Math.random(), name:document.getElementById('wardrobeName').value, type:document.getElementById('wardrobeType').value, price:document.getElementById('wardrobePrice').value, brand:document.getElementById('wardrobeBrand').value, dollId:document.getElementById('wardrobeDollId').value }); await saveAllAndRender(); document.getElementById('wardrobeModal').style.display='none'; };
            document.getElementById('addMakeupBtn').onclick=()=>document.getElementById('makeupModal').style.display='flex'; document.getElementById('closeMakeupBtn').onclick=()=>document.getElementById('makeupModal').style.display='none'; document.getElementById('saveMakeupBtn').onclick=async()=>{ makeups.push({ id:Date.now()+''+Math.random(), dollId:document.getElementById('makeupDollId').value, artist:document.getElementById('makeupArtist').value, name:document.getElementById('makeupName').value, date:document.getElementById('makeupDate').value, price:document.getElementById('makeupPrice').value }); await saveAllAndRender(); document.getElementById('makeupModal').style.display='none'; };
            document.getElementById('addReminderBtn').onclick=()=>document.getElementById('reminderModal').style.display='flex'; document.getElementById('closeReminderBtn').onclick=()=>document.getElementById('reminderModal').style.display='none'; document.getElementById('saveReminderBtn').onclick=async()=>{ reminders.push({ id:Date.now()+''+Math.random(), title:document.getElementById('reminderTitle').value, dollId:document.getElementById('reminderDollId').value, date:document.getElementById('reminderDate').value, type:document.getElementById('reminderType').value }); await saveAllAndRender(); document.getElementById('reminderModal').style.display='none'; };
            
            let pendingInspoImg=null; document.getElementById('inspoSelectImageBtn').onclick=()=>document.getElementById('inspoImageInput').click(); document.getElementById('inspoImageInput').onchange=async(e)=>{ if(e.target.files[0]) pendingInspoImg=await compressImage(e.target.files[0],600); }; document.getElementById('saveInspoBtn').onclick=async()=>{ const title=document.getElementById('inspoTitle').value; if(!title) return; inspirations.push({ id:Date.now()+''+Math.random(), title, description:document.getElementById('inspoDesc').value, source:document.getElementById('inspoSource').value, dollId:document.getElementById('inspoDollId').value, imageBase64:pendingInspoImg||'', createdAt:new Date().toISOString() }); await saveAllAndRender(); document.getElementById('addInspoForm').style.display='none'; pendingInspoImg=null; }; document.getElementById('showAddInspoForm').onclick=()=>document.getElementById('addInspoForm').style.display='block'; document.getElementById('cancelAddInspo').onclick=()=>document.getElementById('addInspoForm').style.display='none';
            document.getElementById('inspoListContainer').addEventListener('click', async(e)=>{ if(e.target.dataset.delInspo){ inspirations=inspirations.filter(i=>i.id!==e.target.dataset.delInspo); await saveAllAndRender(); } });
            document.getElementById('wardrobeList').addEventListener('click', async(e)=>{ if(e.target.dataset.delWard){ wardrobes=wardrobes.filter(w=>w.id!==e.target.dataset.delWard); await saveAllAndRender(); } });
            document.getElementById('reminderList').addEventListener('click', async(e)=>{ if(e.target.dataset.delRem){ reminders=reminders.filter(r=>r.id!==e.target.dataset.delRem); await saveAllAndRender(); } });
        }
        function renderAll() { renderInventory(); renderGallery(); renderInspo(); renderWardrobe(); renderMakeup(); renderReminders(); }
        function escapeHtml(str) { return String(str||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
        (async()=>{ await openDB(); await loadAll(); bindEvents(); if(Notification.permission !== 'granted') Notification.requestPermission(); })();
    })();
</script>
</body>
