<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>灵境培育师 · 放置奇缘 | 高留存数值模拟器</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }

        .game-container {
            max-width: 580px;
            width: 100%;
            background: rgba(255, 248, 225, 0.96);
            border-radius: 64px 64px 48px 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* 宠物区 */
        .pet-zone {
            background: #fef7e0;
            padding: 18px 16px 12px;
            text-align: center;
            border-bottom: 3px solid #ffcf9a;
        }
        .avatar {
            font-size: 85px;
            filter: drop-shadow(6px 8px 12px rgba(0,0,0,0.2));
            transition: transform 0.1s ease;
            cursor: pointer;
        }
        .avatar:active { transform: scale(0.96); }
        .title-badge {
            background: #2c5a2e;
            display: inline-block;
            padding: 4px 18px;
            border-radius: 60px;
            color: #ffefc0;
            font-size: 0.8rem;
            margin-top: 6px;
        }
        .level-info {
            display: flex;
            justify-content: space-between;
            background: #e9dfc7;
            padding: 8px 18px;
            border-radius: 48px;
            margin: 10px 8px 0;
            font-weight: bold;
        }
        .stat-grid {
            display: flex;
            gap: 12px;
            margin: 12px 16px;
        }
        .stat-card {
            background: #fff6e8;
            flex: 1;
            border-radius: 32px;
            padding: 8px;
            text-align: center;
            border: 1px solid #ffdfb0;
        }
        .stat-value { font-size: 24px; font-weight: 800; color: #3b2a1f; }
        .stat-label { font-size: 11px; color: #a7692a; }

        /* 按钮行 */
        .action-buttons {
            display: flex;
            gap: 14px;
            margin: 8px 16px 16px;
        }
        .btn {
            flex: 1;
            border: none;
            padding: 12px 0;
            border-radius: 60px;
            font-weight: bold;
            background: #f5bc70;
            box-shadow: 0 4px 0 #b4622a;
            transition: 0.05s linear;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b4622a; }
        .btn-upgrade { background: #ffa559; box-shadow: 0 4px 0 #c16f2e; }
        .cost { font-size: 0.7rem; display: block; }

        /* 留存模块：签到 & 任务 & BUFF 区域 */
        .retention-panel {
            background: #ecdca8;
            margin: 8px 16px 12px;
            border-radius: 36px;
            padding: 12px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
        }
        .signin-card {
            background: #fff2df;
            border-radius: 32px;
            padding: 8px 12px;
            flex: 1;
            min-width: 110px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .task-card {
            background: #fff2df;
            border-radius: 32px;
            padding: 8px 12px;
            flex: 2;
        }
        .task-item {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
        }
        .task-claim {
            background: #6f9e3f;
            border: none;
            border-radius: 40px;
            color: white;
            padding: 2px 12px;
            font-size: 11px;
            cursor: pointer;
        }
        .buff-area {
            background: #cab577;
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .buff-btn {
            background: #ffd966;
            border: none;
            border-radius: 60px;
            padding: 5px 12px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }
        .achievement-area {
            background: #f9eec9;
            margin: 0 16px 16px;
            border-radius: 36px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .title-name { background: #4a3624; color: #ffefb0; padding: 4px 16px; border-radius: 30px; font-size: 0.75rem; }
        footer { font-size: 10px; text-align: center; padding: 12px; color: #876b42; background: #fff0db; }

        /* 弹窗 */
        .modal {
            position: fixed;
            top:0;left:0;width:100%;height:100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            z-index: 1000;
        }
        .modal.active { visibility: visible; opacity: 1; }
        .modal-content {
            background: #fff7e8;
            max-width: 300px;
            width: 80%;
            padding: 20px;
            border-radius: 48px;
            text-align: center;
        }
        .close-modal { background: #e0a82b; border: none; padding: 8px 20px; border-radius: 40px; margin-top: 12px; cursor: pointer; }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2418e6;
            color: #ffefb0;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.75rem;
            z-index: 1100;
            white-space: nowrap;
            pointer-events: none;
        }
        button:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
        @media (max-width: 500px) {
            .retention-panel { flex-direction: column; }
            .signin-card, .task-card { width: 100%; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <!-- 宠物核心 -->
    <div class="pet-zone">
        <div class="avatar" id="petAvatar">🌱</div>
        <div class="title-badge" id="petTitle">灵境幼苗</div>
        <div class="level-info">
            <span>✨ Lv.<span id="currentLevel">1</span></span>
            <span>⚡ 产出: <span id="goldPerSec">5</span>/s</span>
        </div>
    </div>
    <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">🍃 金币</div><div class="stat-value" id="goldAmount">0</div></div>
        <div class="stat-card"><div class="stat-label">🌟 灵境经验</div><div class="stat-value" id="expAmount">0</div></div>
    </div>
    <div class="action-buttons">
        <button class="btn" id="clickBtn">🌸 轻抚 +10💰</button>
        <button class="btn btn-upgrade" id="upgradeBtn">🌿 灵境突破<br><span class="cost" id="upgradeCost">消耗 60</span></button>
    </div>

    <!-- 新增留存模块：签到+任务+加速buff -->
    <div class="retention-panel">
        <div class="signin-card" id="signinBtn">
            <div>📅 每日签到</div>
            <div id="signinStatus">今日未签到</div>
            <div id="signinRewardHint">+200💰 +50✨</div>
        </div>
        <div class="task-card">
            <div style="font-weight:bold; font-size:12px;">✨ 灵境日课 ✨</div>
            <div id="tasksContainer"></div>
        </div>
    </div>

    <div class="buff-area">
        <span>⚡ 双倍祝福</span>
        <button class="buff-btn" id="activateBuffBtn">激活30分钟 (消耗400💰)</button>
        <span id="buffTimer" style="font-size:12px;">未激活</span>
    </div>

    <div class="achievement-area">
        <span>🏆 称号 · </span>
        <span class="title-name" id="currentTitle">萌芽守护者</span>
        <span class="next-achievement" id="nextAchieveHint">🌟 Lv.5 新外观</span>
    </div>
    <footer>✨ 离线收益自动结算 | 每日任务 & 签到提升黏性 ✨</footer>
</div>

<!-- 离线弹窗 -->
<div id="offlineModal" class="modal">
    <div class="modal-content">
        <h3>🌸 灵境归来 🌸</h3>
        <p>离线期间自然之力为你积攒：</p>
        <div class="offline-reward">🪙 +<span id="offlineGold">0</span> &nbsp; ✨ +<span id="offlineExp">0</span></div>
        <button class="close-modal" id="closeModalBtn">收下馈赠</button>
    </div>
</div>

<script>
    // ------------------- 数值配置 -------------------
    const getGoldPerSecondByLevel = (level) => 5 + (level - 1) * 2;
    const getUpgradeCost = (level) => Math.floor(60 * Math.pow(level, 1.25));

    // 成就系统
    const ACHIEVEMENTS = [
        { minLevel: 1, title: "萌芽守护者", avatar: "🌱", visual: "🌱 嫩芽" },
        { minLevel: 5, title: "翠叶导师", avatar: "🍃", visual: "🍃 青翠叶片" },
        { minLevel: 10, title: "繁花领主", avatar: "🌸", visual: "🌸 灵境之花" },
        { minLevel: 15, title: "辉光古树", avatar: "🌳", visual: "🌳 远古灵木" },
        { minLevel: 20, title: "星辰之灵", avatar: "🌟", visual: "🌟 星尘化身" }
    ];
    const getCurrentAchievement = (level) => {
        let achieve = ACHIEVEMENTS[0];
        for (let i = ACHIEVEMENTS.length-1; i>=0; i--) if(level>=ACHIEVEMENTS[i].minLevel) { achieve = ACHIEVEMENTS[i]; break; }
        return achieve;
    };
    const getNextAchievementHint = (level) => {
        for(let a of ACHIEVEMENTS) if(level < a.minLevel) return `✨ Lv.${a.minLevel} 解锁「${a.title}」`;
        return "🏁 已臻化境";
    };

    // ---------- 游戏核心状态 ----------
    let gameState = {
        gold: 200,      // 初始赠送200让新手立即体验升级与签到
        level: 1,
        exp: 0
    };
    let lastSaveTimestamp = Date.now();
    let intervalId = null;
    let ui = {};

    // 留存相关数据 (每日签到，任务，双倍buff)
    let dailyData = {
        lastSignDate: "",      // YYYY-MM-DD
        signStreak: 0,
        claimedTasks: {}       // { taskId: true }
    };
    let activeBuffEndTime = 0;   // 时间戳(毫秒)，0表示未激活
    let currentTasks = [];       // 存储任务对象 { id, desc, target, progress, rewardGold, rewardExp, claimed }

    // ----- 任务系统 (每日重置，增强留存) -----
    const TASK_TEMPLATES = [
        { id: "click10", desc: "🌸 轻抚灵境 10 次", target: 10, rewardGold: 150, rewardExp: 80 },
        { id: "upgrade1", desc: "🌿 完成 1 次突破升级", target: 1, rewardGold: 200, rewardExp: 100 },
        { id: "earn1000", desc: "💰 累计获得 1000 金币", target: 1000, rewardGold: 250, rewardExp: 120 }
    ];

    // 全局累计获得金币(用于任务进度, 注意不计入离线获得的？但离线获得也累计，符合玩家心理)
    let totalGoldEarned = 0;      // 历史累计获取金币（任务进度用）
    let clickCountToday = 0;      // 今日点击次数（用于任务点击）
    let upgradeCountToday = 0;    // 今日升级次数

    // 辅助函数: 获取今日日期字符串
    const getTodayStr = () => new Date().toISOString().slice(0,10);

    // 重置每日任务(如果跨天)
    function resetDailyIfNeeded() {
        const today = getTodayStr();
        if (dailyData.lastSignDate !== today) {
            // 跨天重置任务进度及领取状态
            dailyData.lastSignDate = today;
            dailyData.claimedTasks = {};
            // 重置任务进度变量
            clickCountToday = 0;
            upgradeCountToday = 0;
            totalGoldEarned = 0;  // 注意累计金币任务基于当天累计获取，重新计算，但为了简单，当天重新累加（离线也算当天？但跨天后重置）
            // 重新初始化任务数组
            initTasks();
            // 签到连续天数逻辑：如果昨天没签到则断签（连续归零）, 但签到动作时才修改streak，这里只负责跨天重置任务
            // 但注意：跨天时如果昨天没有签到，streak应该0，但我们不在resetDaily重置streak，以免签到逻辑混乱，留到签到时候判断
            // 若今日未签到且日期变化，需要把 streak 重置? 实际签到函数会判断 lastSignDate 是否昨天，不是则断签。在这里不做自动重置，保留原streak，签到会判断。
            saveRetentionData();
            renderTasks();  // 刷新任务UI
        }
        // 如果未初始化过任务，也初始化
        if(currentTasks.length === 0) initTasks();
    }

    function initTasks() {
        currentTasks = TASK_TEMPLATES.map(t => ({
            ...t,
            progress: 0,
            claimed: dailyData.claimedTasks[t.id] || false
        }));
        // 根据当天已有进度恢复（clickCountToday, upgradeCountToday, totalGoldEarned）
        const clickTask = currentTasks.find(t => t.id === "click10");
        if(clickTask) clickTask.progress = Math.min(clickTask.target, clickCountToday);
        const upgradeTask = currentTasks.find(t => t.id === "upgrade1");
        if(upgradeTask) upgradeTask.progress = Math.min(upgradeTask.target, upgradeCountToday);
        const earnTask = currentTasks.find(t => t.id === "earn1000");
        if(earnTask) earnTask.progress = Math.min(earnTask.target, totalGoldEarned);
        // 同步领取状态
        for(let t of currentTasks) {
            if(dailyData.claimedTasks[t.id]) t.claimed = true;
        }
        renderTasks();
    }

    function updateTaskProgress(progressType, value=1) {
        // progressType: 'click', 'upgrade', 'earnGold' (增加amount)
        if(progressType === 'click') {
            clickCountToday += value;
            let task = currentTasks.find(t => t.id === "click10");
            if(task && !task.claimed) {
                task.progress = Math.min(task.target, clickCountToday);
                renderTasks();
                saveRetentionData();
            }
        } else if(progressType === 'upgrade') {
            upgradeCountToday += value;
            let task = currentTasks.find(t => t.id === "upgrade1");
            if(task && !task.claimed) {
                task.progress = Math.min(task.target, upgradeCountToday);
                renderTasks();
                saveRetentionData();
            }
        } else if(progressType === 'earnGold') {
            totalGoldEarned += value;
            let task = currentTasks.find(t => t.id === "earn1000");
            if(task && !task.claimed) {
                task.progress = Math.min(task.target, totalGoldEarned);
                renderTasks();
                saveRetentionData();
            }
        }
    }

    function claimTask(taskId) {
        const task = currentTasks.find(t => t.id === taskId);
        if(!task || task.claimed) return false;
        if(task.progress >= task.target) {
            // 发放奖励
            addGoldAndExp(task.rewardGold, task.rewardExp);
            task.claimed = true;
            dailyData.claimedTasks[taskId] = true;
            saveRetentionData();
            renderTasks();
            showFloatingToast(`✅ 任务完成 +${task.rewardGold}💰 +${task.rewardExp}✨`);
            return true;
        } else {
            showFloatingToast(`⏳ 任务未完成: ${task.progress}/${task.target}`);
            return false;
        }
    }

    function renderTasks() {
        const container = document.getElementById('tasksContainer');
        if(!container) return;
        if(currentTasks.length === 0) { container.innerHTML = "<div>加载中..</div>"; return; }
        container.innerHTML = currentTasks.map(task => `
            <div class="task-item">
                <span>${task.desc} (${task.progress}/${task.target})</span>
                <button class="task-claim" data-id="${task.id}" ${task.claimed ? 'disabled' : ''}>${task.claimed ? '已领' : '领取'}</button>
            </div>
        `).join('');
        // 绑定领取事件
        document.querySelectorAll('.task-claim').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                claimTask(id);
            });
        });
    }

    // 签到系统
    function signIn() {
        const today = getTodayStr();
        const lastSign = dailyData.lastSignDate;
        let rewardGold = 200;
        let rewardExp = 50;
        if (lastSign === today) {
            showFloatingToast("今天已经签到过了~ 明天再来吧");
            return false;
        }
        // 连续签到逻辑: 如果昨天签到了则streak+1, 否则重置为1
        let yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yesterdayStr = yesterday.toISOString().slice(0,10);
        if (lastSign === yesterdayStr) {
            dailyData.signStreak = (dailyData.signStreak || 0) + 1;
        } else {
            dailyData.signStreak = 1;
        }
        // 连续签到额外奖励
        let bonus = Math.min(dailyData.signStreak, 7) * 30;
        rewardGold += bonus;
        rewardExp += Math.floor(bonus/2);
        addGoldAndExp(rewardGold, rewardExp);
        dailyData.lastSignDate = today;
        saveRetentionData();
        document.getElementById('signinStatus').innerHTML = '✅ 已签到';
        document.getElementById('signinRewardHint').innerHTML = `+${rewardGold}💰 +${rewardExp}✨ 连签${dailyData.signStreak}天`;
        showFloatingToast(`🎁 签到成功! 获得${rewardGold}金币, ${rewardExp}经验 (连签${dailyData.signStreak}天)`);
        updateSignUI();
        return true;
    }

    function updateSignUI() {
        const today = getTodayStr();
        const signed = (dailyData.lastSignDate === today);
        document.getElementById('signinStatus').innerHTML = signed ? '✅ 今日已签' : '📅 点击签到';
        if(!signed) document.getElementById('signinRewardHint').innerHTML = `+200💰 +50✨ 连签加成`;
    }

    // 双倍buff
    function activateDoubleBuff() {
        const cost = 400;
        if(gameState.gold >= cost) {
            gameState.gold -= cost;
            const now = Date.now();
            // 如果已有buff剩余时间，则叠加时长
            if(activeBuffEndTime > now) {
                activeBuffEndTime += 30 * 60 * 1000;
            } else {
                activeBuffEndTime = now + 30 * 60 * 1000;
            }
            persistGameData();
            saveRetentionData();
            refreshUI();
            showFloatingToast("⚡ 双倍祝福激活! 30分钟内金币与点击收益翻倍 ⚡");
            updateBuffUI();
        } else {
            showFloatingToast(`💰 金币不足，还需${Math.floor(cost - gameState.gold)}`);
        }
    }

    function updateBuffUI() {
        const now = Date.now();
        const buffSpan = document.getElementById('buffTimer');
        if(activeBuffEndTime > now) {
            const remainSec = Math.floor((activeBuffEndTime - now) / 1000);
            const min = Math.floor(remainSec / 60);
            const sec = remainSec % 60;
            buffSpan.innerText = `⏱️ ${min}分${sec}秒`;
        } else {
            activeBuffEndTime = 0;
            buffSpan.innerText = '未激活';
        }
    }

    // 获取实际倍率
    function getCurrentMultiplier() {
        return (activeBuffEndTime > Date.now()) ? 2 : 1;
    }

    // 增加金币和经验(带倍率影响)
    function addGoldAndExp(goldAmount, expAmount = null) {
        if(goldAmount <= 0) return;
        const mult = getCurrentMultiplier();
        const finalGold = goldAmount * mult;
        const finalExp = (expAmount !== null ? expAmount : goldAmount) * mult;
        gameState.gold += finalGold;
        gameState.exp += finalExp;
        // 任务累计金币(仅当日, 但注意离线累计的时候也要)
        updateTaskProgress('earnGold', finalGold);
        refreshUI();
        persistGameData();
    }

    // 挂机生产
    function onTickProduction() {
        const gps = getGoldPerSecondByLevel(gameState.level);
        const mult = getCurrentMultiplier();
        const gain = gps * mult;
        if(gain > 0) {
            addGoldAndExp(gain);
        }
        updateBuffUI();
    }

    // 手动点击 (带倍率)
    function onManualClick() {
        const base = 10;
        const mult = getCurrentMultiplier();
        const gain = base * mult;
        addGoldAndExp(gain);
        updateTaskProgress('click', 1);
        showFloatingToast(`+${Math.floor(gain)}💰`);
        const avatarDiv = document.getElementById('petAvatar');
        avatarDiv.style.transform = 'scale(0.92)';
        setTimeout(() => { if(avatarDiv) avatarDiv.style.transform = ''; }, 100);
    }

    // 升级逻辑
    function upgradeLevel() {
        const cost = getUpgradeCost(gameState.level);
        if(gameState.gold >= cost) {
            gameState.gold -= cost;
            gameState.level += 1;
            updateTaskProgress('upgrade', 1);
            refreshUI();
            persistGameData();
            showFloatingToast(`✨ 突破 Lv.${gameState.level} ！产出提升 ✨`);
            const newAchieve = getCurrentAchievement(gameState.level);
            const oldAchieve = getCurrentAchievement(gameState.level-1);
            if(newAchieve.title !== oldAchieve.title) showFloatingToast(`🎉 新称号「${newAchieve.title}」外观进化！`);
        } else {
            showFloatingToast(`💰 金币不足，还需 ${Math.floor(cost - gameState.gold)}`);
        }
    }

    // 刷新UI (等级、金币、经验、成本、成就)
    function refreshUI() {
        const { gold, level, exp } = gameState;
        const gps = getGoldPerSecondByLevel(level);
        const cost = getUpgradeCost(level);
        const achieve = getCurrentAchievement(level);
        ui.goldAmount.innerText = Math.floor(gold);
        ui.expAmount.innerText = Math.floor(exp);
        ui.currentLevel.innerText = level;
        ui.goldPerSec.innerText = gps;
        ui.upgradeCost.innerText = `消耗 ${cost}`;
        ui.petAvatar.innerText = achieve.avatar;
        ui.petTitle.innerText = achieve.visual;
        ui.currentTitle.innerText = achieve.title;
        ui.nextAchieveHint.innerText = getNextAchievementHint(level);
        ui.upgradeBtn.disabled = (gold < cost);
        updateSignUI();
        updateBuffUI();
    }

    // 离线收益 (强化留存弹窗)
    function applyOfflineReward(savedData, currentTimestamp) {
        const lastTime = savedData.lastTimestamp;
        if (!lastTime) return { goldGain:0, expGain:0 };
        let deltaSec = (currentTimestamp - lastTime) / 1000;
        if(deltaSec <= 0) return { goldGain:0, expGain:0 };
        deltaSec = Math.min(deltaSec, 3 * 24 * 3600);
        const levelAtOffline = savedData.level;
        const gps = getGoldPerSecondByLevel(levelAtOffline);
        let gainedGold = gps * deltaSec;
        let gainedExp = gps * deltaSec;
        if(gainedGold > 0) {
            gameState.gold += gainedGold;
            gameState.exp += gainedExp;
            // 离线收益也计入任务累计金币（当天，但离线归来时日期可能跨天，为防止任务滥用，只增加当日earnGold? 为了公平，累计获得金币计入当日任务，但注意resetDailyIfNeeded会在加载时执行跨天重置，所以没问题）
            updateTaskProgress('earnGold', gainedGold);
        }
        if(gainedGold > 0.01) {
            const modal = document.getElementById('offlineModal');
            document.getElementById('offlineGold').innerText = Math.floor(gainedGold);
            document.getElementById('offlineExp').innerText = Math.floor(gainedExp);
            modal.classList.add('active');
        }
        return { goldGain: gainedGold, expGain: gainedExp };
    }

    // 持久化存储 (游戏状态+留存数据+buff)
    function persistGameData() {
        const saveObj = {
            gold: gameState.gold,
            level: gameState.level,
            exp: gameState.exp,
            lastTimestamp: Date.now(),
            dailyData: dailyData,
            activeBuffEndTime: activeBuffEndTime,
            totalGoldEarned: totalGoldEarned,
            clickCountToday: clickCountToday,
            upgradeCountToday: upgradeCountToday
        };
        localStorage.setItem("IdleCultivatorPro", JSON.stringify(saveObj));
        lastSaveTimestamp = Date.now();
    }
    function saveRetentionData() {
        persistGameData(); // 一并保存
    }

    function loadGameAndOffline() {
        const raw = localStorage.getItem("IdleCultivatorPro");
        const now = Date.now();
        if (!raw) {
            // 初始化默认
            gameState = { gold: 200, level: 1, exp: 0 };
            dailyData = { lastSignDate: "", signStreak: 0, claimedTasks: {} };
            activeBuffEndTime = 0;
            totalGoldEarned = 0; clickCountToday = 0; upgradeCountToday = 0;
            persistGameData();
            resetDailyIfNeeded();
            refreshUI();
            return;
        }
        try {
            const saved = JSON.parse(raw);
            gameState.gold = saved.gold ?? 200;
            gameState.level = saved.level ?? 1;
            gameState.exp = saved.exp ?? 0;
            dailyData = saved.dailyData || { lastSignDate: "", signStreak: 0, claimedTasks: {} };
            activeBuffEndTime = saved.activeBuffEndTime || 0;
            totalGoldEarned = saved.totalGoldEarned || 0;
            clickCountToday = saved.clickCountToday || 0;
            upgradeCountToday = saved.upgradeCountToday || 0;
            const savedTimestamp = saved.lastTimestamp ?? now;
            // 先重置跨天检查
            resetDailyIfNeeded();
            // 恢复任务进度
            initTasks();
            // 离线收益
            const offlineData = { level: saved.level, lastTimestamp: savedTimestamp };
            applyOfflineReward(offlineData, now);
            refreshUI();
            persistGameData();
        } catch(e) { console.warn(e); }
    }

    // 启动挂机及Buff更新定时器
    function startIdleLoop() {
        if(intervalId) clearInterval(intervalId);
        intervalId = setInterval(() => { onTickProduction(); }, 1000);
        setInterval(() => { updateBuffUI(); if(activeBuffEndTime>0 && activeBuffEndTime<=Date.now()) { refreshUI(); showFloatingToast("双倍祝福已结束"); } }, 1000);
    }

    function bindEvents() {
        ui.clickBtn.addEventListener('click', onManualClick);
        ui.upgradeBtn.addEventListener('click', upgradeLevel);
        document.getElementById('signinBtn').addEventListener('click', signIn);
        document.getElementById('activateBuffBtn').addEventListener('click', activateDoubleBuff);
        const modal = document.getElementById('offlineModal');
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.classList.remove('active');
            refreshUI();
            persistGameData();
        });
        modal.addEventListener('click', (e) => { if(e.target===modal) modal.classList.remove('active'); });
    }

    function init() {
        ui = {
            goldAmount: document.getElementById('goldAmount'),
            expAmount: document.getElementById('expAmount'),
            currentLevel: document.getElementById('currentLevel'),
            goldPerSec: document.getElementById('goldPerSec'),
            upgradeCost: document.getElementById('upgradeCost'),
            petAvatar: document.getElementById('petAvatar'),
            petTitle: document.getElementById('petTitle'),
            currentTitle: document.getElementById('currentTitle'),
            nextAchieveHint: document.getElementById('nextAchieveHint'),
            clickBtn: document.getElementById('clickBtn'),
            upgradeBtn: document.getElementById('upgradeBtn')
        };
        loadGameAndOffline();
        bindEvents();
        startIdleLoop();
        setInterval(() => persistGameData(), 15000);
        window.addEventListener('beforeunload', () => persistGameData());
        showFloatingToast("✨ 每日签到 + 任务奖励，双倍祝福助你修行 ✨");
    }
    init();
</script>
</body>
