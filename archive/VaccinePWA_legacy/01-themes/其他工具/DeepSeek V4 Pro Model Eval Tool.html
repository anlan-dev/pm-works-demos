<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek V4 Pro Model Eval</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e0e0e0;
            --text: #3a3a3a;
            --text-sub: #6b6b6b;
            --text-hint: #999;
            --shadow-light: rgba(255,255,255,0.6);
            --shadow-dark: rgba(0,0,0,0.12);
            --shadow-light-sm: rgba(255,255,255,0.5);
            --shadow-dark-sm: rgba(0,0,0,0.08);
            --accent: #5a7abf;
            --accent-light: #7b9ad6;
            --correct: #5a9e6f;
            --correct-dark: #3d7a50;
            --wrong: #c05050;
            --wrong-dark: #a03a3a;
            --warn: #b89a3e;
            --warn-dark: #967d2e;
            --purple: #7a6aaa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            max-width: 920px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-sub);
        }
        .card {
            background: var(--bg);
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            border: none;
        }
        .card-title {
            font-size: 0.82rem;
            color: var(--text-sub);
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .neu-input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            background: var(--bg);
            border: none;
            border-radius: 16px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text);
            box-shadow: inset 4px 4px 8px var(--shadow-dark-sm), inset -4px -4px 8px var(--shadow-light-sm);
            transition: box-shadow 0.2s ease;
            outline: none;
        }
        .neu-input::placeholder { color: var(--text-hint); }
        .neu-input:focus {
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.1), inset -5px -5px 10px rgba(255,255,255,0.6);
        }
        textarea.neu-input { resize: vertical; }
        .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .neu-btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: var(--bg);
            color: var(--text);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: all 0.15s ease;
            outline: none;
        }
        .neu-btn:hover {
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }
        .neu-btn:active, .neu-btn.pressed {
            box-shadow: inset 4px 4px 8px var(--shadow-dark-sm), inset -4px -4px 8px var(--shadow-light-sm);
            transform: scale(0.97);
        }
        .neu-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .neu-btn:disabled:hover { transform: none; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
        .neu-btn-sm {
            padding: 0.45rem 1rem;
            font-size: 0.78rem;
            border-radius: 20px;
        }
        .neu-btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .neu-btn-accent { color: var(--accent); }
        .neu-btn-correct { color: var(--correct); }
        .neu-btn-wrong { color: var(--wrong); }
        .neu-btn-purple { color: var(--purple); }
        .neu-btn-warn { color: var(--warn); }
        .neu-btn-primary {
            background: var(--bg);
            color: var(--accent);
            font-weight: 600;
            padding: 0.85rem 2.5rem;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
        }
        .inset-area {
            background: var(--bg);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: inset 4px 4px 8px var(--shadow-dark-sm), inset -4px -4px 8px var(--shadow-light-sm);
        }
        ul.case-list { list-style: none; }
        .case-item {
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.03);
        }
        .case-item:last-child { border-bottom: none; }
        .case-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .case-label { font-weight: 600; font-size: 0.85rem; color: var(--text); }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            box-shadow: 2px 2px 4px var(--shadow-dark-sm), -2px -2px 4px var(--shadow-light-sm);
        }
        .badge-pending { color: var(--text-hint); }
        .badge-running { color: var(--accent); }
        .badge-done { color: var(--correct); }
        .badge-error { color: var(--wrong); }
        .badge-correct { color: var(--correct); box-shadow: inset 2px 2px 4px rgba(90,158,111,0.15), inset -2px -2px 4px var(--shadow-light-sm); }
        .badge-wrong { color: var(--wrong); box-shadow: inset 2px 2px 4px rgba(192,80,80,0.15), inset -2px -2px 4px var(--shadow-light-sm); }
        .case-prompt { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 0.5rem; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .case-response {
            font-size: 0.82rem;
            color: var(--text);
            background: var(--bg);
            padding: 0.8rem 1rem;
            border-radius: 16px;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 1.5em;
            box-shadow: inset 3px 3px 6px var(--shadow-dark-sm), inset -3px -3px 6px var(--shadow-light-sm);
            line-height: 1.6;
        }
        .case-actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
        .stats { font-size: 0.75rem; color: var(--text-hint); margin-top: 0.5rem; letter-spacing: 0.02em; }
        .expected-answer {
            font-size: 0.82rem;
            color: var(--purple);
            background: var(--bg);
            padding: 0.6rem 1rem;
            border-radius: 16px;
            margin-bottom: 0.5rem;
            box-shadow: inset 3px 3px 6px rgba(122,106,170,0.08), inset -3px -3px 6px var(--shadow-light-sm);
        }
        .accuracy-bar { display: flex; align-items: center; gap: 1.5rem; }
        .accuracy-num { font-size: 2.2rem; font-weight: 300; color: var(--accent); letter-spacing: -0.02em; }
        .accuracy-detail { font-size: 0.82rem; color: var(--text-sub); line-height: 1.7; }
        .progress-text { font-size: 0.82rem; color: var(--text-sub); }
        .add-area { display: flex; gap: 1rem; margin-top: 1rem; }
        .add-area textarea { flex: 1; }
        .slider-row { display: flex; align-items: center; gap: 1rem; }
        .slider-row .slider-label { font-size: 0.82rem; color: var(--text-sub); font-weight: 600; min-width: 5.5em; }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            box-shadow: inset 2px 2px 4px var(--shadow-dark-sm), inset -2px -2px 4px var(--shadow-light-sm);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg);
            cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            transition: box-shadow 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark-sm), inset -2px -2px 4px var(--shadow-light-sm);
        }
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg);
            cursor: pointer;
            border: none;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        .slider-val { font-size: 0.85rem; font-weight: 600; color: var(--accent); min-width: 2.5em; text-align: center; }
        .case-header-actions { display: flex; gap: 0.4rem; align-items: center; }
        .config-grid { display: grid; gap: 1rem; }
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .card { padding: 1.2rem; border-radius: 24px; }
            .card-title { font-size: 0.78rem; }
        }
    </style>
</head>
<body>

<h1>DEEPSEEK V4 PRO MODEL EVAL</h1>

<div class="card">
    <div class="card-title">API Key</div>
    <div class="row">
        <input type="password" class="neu-input" id="apiKey" placeholder="输入 DeepSeek API Key（自动保存到本地）"/>
        <button class="neu-btn neu-btn-icon" onclick="toggleKeyVis()" title="显示/隐藏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="neu-btn neu-btn-icon neu-btn-warn" onclick="clearResults()" title="清空结果">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
    </div>
</div>

<div class="card">
    <div class="card-title">评测配置</div>
    <div class="config-grid">
        <input type="text" class="neu-input" id="systemPrompt" placeholder="System Prompt（可选，留空则不发送）"/>
        <div class="slider-row">
            <span class="slider-label">Temperature</span>
            <input type="range" id="tempSlider" min="0" max="2" step="0.1" value="0.7"/>
            <span class="slider-val" id="tempVal">0.7</span>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-title">测试用例 <span style="font-size:0.7rem;text-transform:none;font-weight:400;color:var(--text-hint)">（expected=预设期望答案，留空则手动判分）</span></div>
    <div class="inset-area">
        <ul class="case-list" id="caseList"></ul>
    </div>
    <div class="add-area">
        <textarea class="neu-input" id="newPrompt" rows="2" placeholder="添加自定义测试用例..."></textarea>
        <div style="display:flex;flex-direction:column;gap:0.5rem;flex-shrink:0">
            <button class="neu-btn neu-btn-sm" onclick="addCase()">添加</button>
            <button class="neu-btn neu-btn-sm neu-btn-purple" onclick="exportCases()">导出</button>
            <button class="neu-btn neu-btn-sm neu-btn-purple" onclick="importCases()">导入</button>
        </div>
    </div>
</div>

<div style="display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem;justify-content:center">
    <button class="neu-btn neu-btn-primary" id="runBtn" onclick="runAll()">▶ 批量运行</button>
    <span class="progress-text" id="progressText"></span>
</div>

<div class="card">
    <div class="card-title">评测结果</div>
    <div class="accuracy-bar">
        <div class="accuracy-num" id="accuracyNum">--</div>
        <div>
            <div class="accuracy-detail" id="accuracyDetail">暂无评测数据</div>
            <div class="accuracy-detail" style="color:var(--text-hint)">手动标记或预设期望答案后自动计算</div>
        </div>
    </div>
</div>

<script>
const LK_A='ds_eval_apikey',LK_C='ds_eval_cases',LK_R='ds_eval_results',LK_S='ds_eval_sys',LK_T='ds_eval_temp';
const API_URL='https://api.deepseek.com/v1/chat/completions';
const MODEL='deepseek-chat';
const CONCURRENCY=2,MAX_RETRY=1;
const PRICE_IN=0.27,PRICE_OUT=1.1;
const DEFAULT_CASES=[
    {id:'c1',prompt:'请将以下句子翻译成英文：人工智能正在深刻改变医疗行业的运作方式。',expected:'AI is profoundly transforming the way the healthcare industry operates.'},
    {id:'c2',prompt:'请用一句话总结量子计算的核心原理。',expected:''},
    {id:'c3',prompt:'请判断以下说法是否正确，并简要说明理由："地球是太阳系中最大的行星。"',expected:'不正确。木星才是太阳系中最大的行星。'},
    {id:'c4',prompt:'请用 Python 写一个函数，输入一个整数列表，返回其中所有偶数的平方和。',expected:''},
    {id:'c5',prompt:'请解释"机会成本"这个经济学概念，并举一个生活中的例子。',expected:''}
];
let cases=[],results={};
function load(){
    const k=localStorage.getItem(LK_A);if(k)$id('apiKey').value=k;
    try{cases=JSON.parse(localStorage.getItem(LK_C))||[]}catch{cases=[]}
    if(!cases.length){cases=DEFAULT_CASES;save()}
    try{results=JSON.parse(localStorage.getItem(LK_R))||[]}catch{results={}}
    const sp=localStorage.getItem(LK_S);if(sp)$id('systemPrompt').value=sp;
    const tp=localStorage.getItem(LK_T);if(tp)$id('tempSlider').value=tp;
    $id('tempVal').textContent=$id('tempSlider').value;
}
function save(){localStorage.setItem(LK_C,JSON.stringify(cases))}
function saveR(){localStorage.setItem(LK_R,JSON.stringify(results))}
function saveK(){localStorage.setItem(LK_A,$id('apiKey').value.trim())}
function $id(e){return document.getElementById(e)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toggleKeyVis(){const e=$id('apiKey');e.type=e.type==='password'?'text':'password'}
function addCase(){
    const p=$id('newPrompt').value.trim();if(!p)return;
    cases.push({id:'c'+Date.now(),prompt:p,expected:''});
    $id('newPrompt').value='';save();render();
}
function removeCase(id){cases=cases.filter(c=>c.id!==id);delete results[id];save();saveR();render()}
function mark(id,v){if(!results[id])results[id]={};results[id].status=v;saveR();render()}
function calcAccuracy(){
    cases.forEach(c=>{
        const r=results[c.id];if(!r||r.status!=='done')return;
        if(c.expected){
            const sim=similarity(r.response,c.expected);
            if(sim>=0.6){r.status='correct'}
        }
    });
    const marked=cases.filter(c=>results[c.id]&&(results[c.id].status==='correct'||results[c.id].status==='wrong'));
    const correct=marked.filter(c=>results[c.id].status==='correct').length;
    const total=marked.length;
    $id('accuracyNum').textContent=total?Math.round(correct/total*100)+'%':'--';
    $id('accuracyDetail').textContent=total?correct+'/'+total+' 正确':'暂无评测数据（请标记或设置 expected）';
}
function similarity(a,b){
    const ta=a.trim().toLowerCase(),tb=b.trim().toLowerCase();
    if(ta===tb)return 1;
    const wa=new Set(ta.split(/\s+/)),wb=new Set(tb.split(/\s+/));
    const inter=[...wa].filter(x=>wb.has(x)).length;
    const union=new Set([...wa,...wb]).size;
    return union?inter/union:0;
}
function clearResults(){if(!confirm('确定清空所有结果？'))return;results={};saveR();render()}
function exportCases(){
    const d=JSON.stringify(cases,null,2);
    const b=new Blob([d],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='eval-cases.json';a.click();
}
function importCases(){
    const f=document.createElement('input');f.type='file';f.accept='.json';
    f.onchange=e=>{
        const r=new FileReader();
        r.onload=ev=>{
            try{
                const d=JSON.parse(ev.target.result);
                if(!Array.isArray(d))throw new Error();
                cases=d.map((c,i)=>({id:c.id||'imp'+Date.now()+i,prompt:c.prompt,expected:c.expected||''}));
                save();render();
            }catch{alert('JSON 格式错误')}
        };
        r.readAsText(e.target.files[0]);
    };
    f.click();
}
function streamAPI(prompt,apiKey,onChunk){
    const msgs=[];
    const sys=$id('systemPrompt').value.trim();
    if(sys)msgs.push({role:'system',content:sys});
    msgs.push({role:'user',content:prompt});
    return fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:'Bearer '+apiKey},
        body:JSON.stringify({model:MODEL,messages:msgs,stream:true,temperature:+$id('tempSlider').value})
    }).then(async resp=>{
        if(!resp.ok)throw new Error('HTTP '+resp.status);
        const reader=resp.body.getReader();
        const dec=new TextDecoder();
        let full='',usage={};
        while(true){
            const{done,value}=await reader.read();
            if(done)break;
            const chunk=dec.decode(value,{stream:true});
            const lines=chunk.split('\n');
            for(const line of lines){
                if(!line.startsWith('data:'))continue;
                const payload=line.slice(5).trim();
                if(payload==='[DONE]')continue;
                try{
                    const j=JSON.parse(payload);
                    const d=j.choices&&j.choices[0]&&j.choices[0].delta;
                    if(d&&d.content){full+=d.content;onChunk(full)}
                    if(j.usage)usage=j.usage;
                }catch{}
            }
        }
        return{content:full,usage};
    });
}
async function callWithRetry(prompt,apiKey,onChunk){
    let lastErr;
    for(let i=0;i<=MAX_RETRY;i++){
        try{return await streamAPI(prompt,apiKey,onChunk)}catch(e){lastErr=e}
    }
    throw lastErr;
}
async function runAll(){
    const apiKey=$id('apiKey').value.trim();
    if(!apiKey)return alert('请输入 API Key');
    saveK();
    localStorage.setItem(LK_S,$id('systemPrompt').value.trim());
    localStorage.setItem(LK_T,$id('tempSlider').value);
    const btn=$id('runBtn');btn.disabled=true;
    const progress=$id('progressText');
    let done=0;const total=cases.length;
    progress.textContent='0/'+total;
    const queue=cases.map(c=>async()=>{
        const t0=performance.now();
        results[c.id]={status:'running',response:'⏱ 请求中...',meta:{}};render();
        try{
            const{content,usage}=await callWithRetry(c.prompt,apiKey,(partial)=>{
                results[c.id].response=partial+'▋';render();
            });
            const dur=Math.round(performance.now()-t0);
            const pt=usage.prompt_tokens||0,ct=usage.completion_tokens||0;
            const cost=((pt*PRICE_IN+ct*PRICE_OUT)/1e6).toFixed(4);
            results[c.id]={status:'done',response:content,meta:{dur,pt,ct,cost}};
        }catch(e){
            results[c.id].status='error';results[c.id].response=e.message;
        }
        done++;progress.textContent=done+'/'+total;saveR();render();
    });
    const pool=[];
    for(const task of queue){
        const p=task().then(()=>pool.splice(pool.indexOf(p),1));
        pool.push(p);
        if(pool.length>=CONCURRENCY)await Promise.race(pool);
    }
    await Promise.all(pool);
    progress.textContent='完成 ✓';btn.disabled=false;
}
function render(){
    const ul=$id('caseList');ul.innerHTML='';
    cases.forEach((c,i)=>{
        const r=results[c.id]||{};
        const status=r.status||'pending';
        const li=document.createElement('li');li.className='case-item';
        const bc={pending:'badge-pending',running:'badge-running',done:'badge-done',error:'badge-error',correct:'badge-correct',wrong:'badge-wrong'}[status]||'badge-pending';
        const bt={pending:'待运行',running:'运行中',done:'已完成',error:'失败',correct:'✓ 正确',wrong:'✗ 错误'}[status]||status;
        const m=r.meta||{};
        let stats='';if(m.dur)stats=`⏱ ${m.dur}ms · 📥 ${m.pt}↑ ${m.ct}↓ tokens · 💰 $${m.cost}`;
        li.innerHTML=`
            <div class="case-header">
                <span class="case-label">#${i+1} <span class="badge ${bc}">${bt}</span></span>
                <div class="case-header-actions">
                    ${status==='done'||status==='error'?`<button class="neu-btn neu-btn-sm neu-btn-icon neu-btn-accent" onclick="runSingle('${c.id}')" title="重跑">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    </button>`:''}
                    <button class="neu-btn neu-btn-sm neu-btn-icon" onclick="removeCase('${c.id}')" title="删除">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="case-prompt">${esc(c.prompt)}</div>
            ${c.expected?`<div class="expected-answer">Expected: ${esc(c.expected)}</div>`:''}
            ${r.response?`<div class="case-response">${esc(r.response)}</div>`:''}
            ${stats?`<div class="stats">${stats}</div>`:''}
            ${status==='done'?`
                <div class="case-actions">
                    <button class="neu-btn neu-btn-sm neu-btn-correct" onclick="mark('${c.id}','correct')">✓ 正确</button>
                    <button class="neu-btn neu-btn-sm neu-btn-wrong" onclick="mark('${c.id}','wrong')">✗ 错误</button>
                </div>`:''}
        `;
        ul.appendChild(li);
    });
    calcAccuracy();
}
async function runSingle(id){
    const apiKey=$id('apiKey').value.trim();
    if(!apiKey)return alert('请输入 API Key');
    saveK();
    localStorage.setItem(LK_S,$id('systemPrompt').value.trim());
    localStorage.setItem(LK_T,$id('tempSlider').value);
    const c=cases.find(x=>x.id===id);if(!c)return;
    const t0=performance.now();
    results[c.id]={status:'running',response:'⏱ 请求中...',meta:{}};render();
    try{
        const{content,usage}=await callWithRetry(c.prompt,apiKey,(partial)=>{
            results[c.id].response=partial+'▋';render();
        });
        const dur=Math.round(performance.now()-t0);
        const pt=usage.prompt_tokens||0,ct=usage.completion_tokens||0;
        const cost=((pt*PRICE_IN+ct*PRICE_OUT)/1e6).toFixed(4);
        results[c.id]={status:'done',response:content,meta:{dur,pt,ct,cost}};
    }catch(e){
        results[c.id].status='error';results[c.id].response=e.message;
    }
    saveR();render();
}
load();render();
$id('apiKey').addEventListener('input',saveK);
$id('tempSlider').addEventListener('input',function(){$id('tempVal').textContent=this.value});
</script>
